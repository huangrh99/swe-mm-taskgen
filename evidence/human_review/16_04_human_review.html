.warning{color:var(--warn)}.attention{border-left:4px solid var(--warn);background:#fff3e7;padding:10px 12px;border-radius:6px}@media(max-width:760px){.grid{grid-template-columns:1fr}main{padding:12px}}

<h3>② 候选题面草案</h3>${needsStatement?'<p class="attention"><b>需人工整理题面：</b>当前没有合格的关联 Issue。请根据 PR 所修复的用户可观察问题重新表述题面，但不要复制实现方案、patch、测试答案或 After 图中的修复细节。</p>':''}<p class="muted">由关联 Issue 的标题、正文和图片位置生成；不包含 PR 解法。原文与中文译文分别保存，导出时原文写入 <code>problem_statement</code>。</p><textarea class="problem-draft" data-k="${statementKey}">${esc(statement)}</textarea>
<details class="problem-sources"><summary>查看题面来源原文与 Issue 链接</summary><div class="details-body">${sources||'<p class="warning">没有合格的关联 Issue，当前题面为空。</p>'}</div></details>
<h3>③ 题面视觉材料（将提供给 agent）</h3><div class="assets">${assets||'<p>关联 Issue 正文中没有已固化图片。</p>'}</div><p class="source-links"><a href="${esc(row.curator_links.source_archive)}">完整来源档案</a>${row.curator_links.case_manifest?`<a href="${esc(row.curator_links.case_manifest)}">case manifest / patch-test provenance</a>`:''}</p>
<h3>④ Verifier 结论</h3><div class="verifier-summary">${summaries}</div>${ann}${vis}
<div class="grid"><div><label>只看文字时的判断与缺失信息<textarea data-k="text_first_notes">${esc(s.text_first_notes||'')}</textarea></label><label>图片新增的、文字无法恢复的事实<textarea data-k="visual_delta">${esc(s.visual_delta||'')}</textarea></label></div><div><label>reference patch 与测试是否验证该事实<textarea data-k="patch_and_test_alignment">${esc(s.patch_and_test_alignment||'')}</textarea></label><label>人工标签<select data-k="decision">${opts}</select></label><label>判断理由<textarea data-k="decision_reason">${esc(s.decision_reason||'')}</textarea></label></div></div><label><input style="width:auto" type="checkbox" data-k="ablation_required" ${s.ablation_required?'checked':''}> 仍需第三级 agent 消融</label></section>`}
function grow(el){if(el.classList.contains('problem-draft')){el.style.height='auto';el.style.height=el.scrollHeight+'px'}}
function renderCurrent(){document.querySelector('#root').innerHTML=showCase(DATA.rows[current]);document.querySelector('#counter').textContent=`${current+1} / ${DATA.rows.length}`;document.querySelector('#language').textContent=language==='zh'?'查看原文':'切换为中文';document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===DATA.rows.length-1;document.querySelectorAll('[data-k]').forEach(el=>{grow(el);el.addEventListener('input',()=>{field(el.closest('.case').dataset.id,el.dataset.k,el.type==='checkbox'?el.checked:el.value);grow(el)})})}
function move(delta){current=Math.min(Math.max(current+delta,0),DATA.rows.length-1);localStorage.setItem(PAGE_KEY,String(current));renderCurrent();window.scrollTo(0,0)}document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.querySelector('#language').onclick=()=>{language=language==='zh'?'original':'zh';localStorage.setItem(LANG_KEY,language);renderCurrent()};renderCurrent();
document.querySelector('#export').onclick=()=>{const rows=DATA.rows.map(r=>Object.assign({},r.human_seed,saved[r.case_id]||{},{reviewed_at:(saved[r.case_id]?.decision?new Date().toISOString():null),agent_ablation:{required:!!saved[r.case_id]?.ablation_required,reason:saved[r.case_id]?.ablation_required?'human requested':'',status:'not_run'}}));const blob=new Blob([JSON.stringify({schema_version:'visual-necessity-human-export-v1',source_manifest_sha256:DATA.manifest_sha256,rows},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='16_04_human_decisions.json';a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
