<!doctype html>
<meta charset="utf-8">
<title>p5.js #7532 deterministic clip-mask fixture</title>
<script src="/p5.js"></script>
<pre id="result"></pre>
<script>
function setup() {
  pixelDensity(1);
  createCanvas(400, 400);
  noStroke();
  background(255);

  beginClip();
  beginShape();
  vertex(100, 100);
  vertex(200, 100);
  vertex(200, 200);
  vertex(100, 200);
  endShape();
  beginShape();
  vertex(200, 150);
  vertex(300, 150);
  vertex(300, 250);
  vertex(200, 250);
  endShape();
  circle(200, 250, 50);
  endClip();
  fill(0);
  rect(0, 0, width, height);
  loadPixels();

  const dark = (graphics, x, y) => {
    graphics.loadPixels();
    return graphics.pixels[4 * (y * graphics.width + x)] < 64;
  };
  const mainDark = (x, y) => pixels[4 * (y * width + x)] < 64;
  const expandedUnion = (x, y) =>
    (x >= 98 && x <= 202 && y >= 98 && y <= 202) ||
    (x >= 198 && x <= 302 && y >= 148 && y <= 252) ||
    ((x - 200) ** 2 + (y - 250) ** 2 <= 27 ** 2);
  const contractedUnion = (x, y) =>
    (x >= 102 && x <= 198 && y >= 102 && y <= 198) ||
    (x >= 202 && x <= 298 && y >= 152 && y <= 248) ||
    ((x - 200) ** 2 + (y - 250) ** 2 <= 22 ** 2);
  let unexpected = 0;
  let missing = 0;
  for (let y = 0; y < height; y += 1) {
    for (let x = 0; x < width; x += 1) {
      const pixelIsDark = mainDark(x, y);
      if (pixelIsDark && !expandedUnion(x, y)) unexpected += 1;
      if (!pixelIsDark && contractedUnion(x, y)) missing += 1;
    }
  }

  const normalClip = createGraphics(100, 100);
  normalClip.pixelDensity(1); normalClip.background(255); normalClip.noStroke();
  normalClip.beginClip(); normalClip.rect(20, 20, 50, 50); normalClip.endClip();
  normalClip.fill(0); normalClip.rect(0, 0, 100, 100);

  const invertedClip = createGraphics(100, 100);
  invertedClip.pixelDensity(1); invertedClip.background(255); invertedClip.noStroke();
  invertedClip.beginClip({invert: true}); invertedClip.rect(20, 20, 50, 50); invertedClip.endClip();
  invertedClip.fill(0); invertedClip.rect(0, 0, 100, 100);

  const ordinaryShape = createGraphics(100, 100);
  ordinaryShape.pixelDensity(1); ordinaryShape.background(255); ordinaryShape.noStroke(); ordinaryShape.fill(0);
  ordinaryShape.beginShape(); ordinaryShape.vertex(20, 20); ordinaryShape.vertex(80, 20);
  ordinaryShape.vertex(50, 80); ordinaryShape.endShape(CLOSE);

  const observed = {
    missing_interior_pixels: missing,
    unexpected_exterior_pixels: unexpected,
    normal_clip: dark(normalClip, 30, 30) && !dark(normalClip, 5, 5),
    inverted_clip: !dark(invertedClip, 30, 30) && dark(invertedClip, 5, 5),
    ordinary_shape: dark(ordinaryShape, 50, 40) && !dark(ordinaryShape, 5, 5)
  };
  document.querySelector('#result').textContent = JSON.stringify(observed);
  noLoop();
}
</script>
